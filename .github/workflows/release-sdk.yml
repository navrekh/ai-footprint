name: Release SDK to PyPI

# Publishes only on an intentional release: pushing a tag of the form
# sdk-v<version> (e.g. sdk-v0.1.0). Never runs on an ordinary push/PR,
# so no build here can accidentally publish.
on:
  push:
    tags:
      - "sdk-v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and test
        working-directory: sdk
        run: |
          pip install -e ".[dev]"
          ruff check aifootprint tests
          mypy aifootprint
          pytest

      - name: Build wheel + sdist
        working-directory: sdk
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Reject artifacts containing an API-key-shaped secret
        working-directory: sdk
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdk-inspect
          for f in dist/*; do
            case "$f" in
              *.whl) python -m zipfile -e "$f" /tmp/sdk-inspect ;;
              *.tar.gz) tar -xzf "$f" -C /tmp/sdk-inspect ;;
            esac
          done
          if grep -rlE "afp_(live|test)_[A-Za-z0-9]+" /tmp/sdk-inspect; then
            echo "::error::Built artifact contains what looks like a live AI Footprint API key. Refusing to publish."
            exit 1
          fi

      - name: Verify tag matches package version
        working-directory: sdk
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION="$(python -c 'import aifootprint; print(aifootprint.__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match aifootprint.__version__=$PKG_VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-release-dist
          path: sdk/dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-sdk-release
      url: https://pypi.org/project/aifootprint/
    permissions:
      # OIDC token for PyPI trusted publishing. No PyPI API token/secret
      # is configured or used anywhere in this workflow.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
