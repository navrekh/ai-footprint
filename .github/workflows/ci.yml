name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK — lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SDK (dev extras)
        working-directory: sdk
        run: pip install -e ".[dev]"

      - name: Ruff
        working-directory: sdk
        run: ruff check aifootprint tests

      - name: Mypy
        working-directory: sdk
        run: mypy aifootprint

      - name: Unit tests
        working-directory: sdk
        run: pytest

      - name: Build wheel + sdist
        working-directory: sdk
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/

  cli:
    name: CLI — lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SDK, then CLI (dev extras)
        run: |
          pip install -e ./sdk
          pip install -e "./cli[dev]"

      - name: Ruff
        working-directory: cli
        run: ruff check aifootprint_cli tests

      - name: Mypy
        working-directory: cli
        run: mypy aifootprint_cli

      - name: Unit tests
        working-directory: cli
        run: pytest

      - name: Build wheel + sdist
        working-directory: cli
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: cli/dist/

  public-site:
    name: Public site — validate static content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject secret-shaped strings (API keys must never appear here)
        run: |
          set -euo pipefail
          if grep -rEn "afp_(live|test)_[A-Za-z0-9]+" frontend/public-site; then
            echo "::error::frontend/public-site contains what looks like a live AI Footprint API key."
            exit 1
          fi

      - name: Serve and smoke-check pages load
        run: |
          set -euo pipefail
          cd frontend/public-site
          python3 -m http.server 8091 &
          SERVER_PID=$!
          sleep 1
          for path in index.html styles.css; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8091/$path")
            if [ "$code" != "200" ]; then
              echo "::error::$path returned HTTP $code"
              kill "$SERVER_PID"
              exit 1
            fi
          done
          kill "$SERVER_PID"

  cli-clean-install:
    name: CLI — installs from built wheels in a clean environment
    runs-on: ubuntu-latest
    needs: [sdk, cli]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: sdk-dist

      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: cli-dist

      - name: Install CLI + SDK from built artifacts only (no repository checkout, no editable install)
        run: pip install --find-links sdk-dist --find-links cli-dist aifootprint-cli

      - name: aifootprint --help
        run: aifootprint --help

      - name: aifootprint --version
        run: aifootprint --version
