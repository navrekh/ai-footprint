[project]
name = "aifootprint-cli"
dynamic = ["version"]
description = "Command-line client for the AI Footprint API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AI Footprint" }]
keywords = ["ai-footprint", "sustainability", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Deliberately just the SDK - no CLI-parsing framework, no HTTP library
# of its own. The CLI uses the standard library's argparse (no new
# runtime dependency is justified for the command surface Sprint 7
# defines) and is a pure consumer of the existing `aifootprint` SDK,
# which remains the sole HTTP/authentication boundary (see
# aifootprint_cli/cli.py module docstring).
#
# Compatible-release constraint (see docs/RELEASING.md "Versioning
# policy"): the CLI and SDK version independently, but the CLI pins to
# the SDK's current minor line so a future SDK 0.2.0 (or 1.0.0) cannot
# be pulled in silently by `pip install -U` without the CLI also being
# updated to declare support for it.
dependencies = [
    "aifootprint>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[project.scripts]
aifootprint = "aifootprint_cli.cli:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aifootprint_cli*"]

[tool.setuptools.dynamic]
version = { attr = "aifootprint_cli.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a locally running backend + Postgres (see tests/integration/README.md); run with `pytest -m integration`",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]
